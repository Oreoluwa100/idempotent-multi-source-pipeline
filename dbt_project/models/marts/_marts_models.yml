version: 2

models:
  - name: fct_orders
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: product_category
        data_tests:
          - accepted_values:
              arguments:
                values: ['Sport wears', 'Gym wears', 'Lounge wears', 'Party wears']
  
  - name: fct_order_status_events
    columns:
      - name: event_id
        data_tests:
          - unique
          - not_null
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['placed', 'shipped', 'delivered', 'cancelled']
      - name: changed_by_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['system', 'agent']

  - name: dim_customers
    columns:
      - name: email
        data_tests:
          - unique
          - not_null
      - name: account_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['active', 'inactive', 'suspended']
      - name: source_systems
        data_tests:
          - accepted_values:
              arguments:
                values: ['legacy', 'modern', 'both']